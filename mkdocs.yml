site_name: AIShoppingAgent
site_description: >-
  Agente de compras que monitora preços em várias lojas e avisa você no
  Telegram na hora certa de comprar.
site_url: https://jhonnatancesar.github.io/
site_author: jhonnatancesar

theme:
  name: material
  custom_dir: overrides
  language: pt-BR
  font:
    text: Inter
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Alternar para modo escuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Alternar para modo claro
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - content.tooltips
    - search.suggest
    - search.highlight
  icon:
    repo: fontawesome/brands/github

extra_css:
  - assets/extra.css

extra_javascript:
  - assets/extra.js

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

nav:
  - Início: index.md
  - Como funciona:
      - como-funciona.md
      - monitoramento.md
      - missoes.md
      - telegram.md
      - lojas.md
      - sobre.md
  - Recursos: recursos.md
  - Demonstração: demonstracao.md
  - Novidades: novidades.md
  - Ajuda:
      - faq.md
      - releases.md
      - comecar.md

copyright: >
  AIShoppingAgent — projeto pessoal independente. Não afiliado a nenhuma das
  lojas mencionadas.
